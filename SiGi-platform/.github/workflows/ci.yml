name: sigi-ci

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit:prod

      - name: Lint and static validation
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Workspace builds
        run: npm run build
