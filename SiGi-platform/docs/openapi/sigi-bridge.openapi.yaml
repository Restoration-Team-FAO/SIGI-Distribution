openapi: 3.1.0
info:
  title: SIGI Bridge API
  version: 0.1.0
servers:
  - url: http://localhost:3010
paths:
  /exports/{target}:
    get:
      summary: Get export target status
      parameters:
        - in: path
          name: target
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export target state
    post:
      summary: Trigger export
      parameters:
        - in: path
          name: target
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Export accepted
