services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigi_db}
      POSTGRES_USER: ${POSTGRES_USER:-sigi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigi_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigi_user} -d ${POSTGRES_DB:-sigi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  sigi-api:
    build: ./apps/sigi-api
    ports:
      - "${SIGI_API_PORT:-3000}:3000"
    environment:
      SIGI_API_PORT: ${SIGI_API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sigi_user:sigi_password@postgres:5432/sigi_db}
      INTEGRATION_SERVICE_URL: ${INTEGRATION_SERVICE_URL:-http://integration-service:8001}
      GIS_SERVICE_URL: ${GIS_SERVICE_URL:-http://gis-service:8002}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_CLIENT_TIMEOUT_MS: ${HTTP_CLIENT_TIMEOUT_MS:-5000}
      HTTP_CLIENT_MAX_RETRIES: ${HTTP_CLIENT_MAX_RETRIES:-2}
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:-/var/sigi-files}
      FILE_MAX_UPLOAD_MB: ${FILE_MAX_UPLOAD_MB:-25}
      FILE_ALLOWED_EXTENSIONS: ${FILE_ALLOWED_EXTENSIONS:-pdf,doc,docx,xls,xlsx,csv,txt,jpg,jpeg,png,geojson,json,zip}
      SIGI_SUPERADMIN_TOKEN: ${SIGI_SUPERADMIN_TOKEN:-superadmin-dev-token}
      SIGI_NATIONAL_ADMIN_TOKEN: ${SIGI_NATIONAL_ADMIN_TOKEN:-national-admin-dev-token}
      SIGI_EDITOR_TOKEN: ${SIGI_EDITOR_TOKEN:-editor-dev-token}
      SIGI_VALIDATOR_TOKEN: ${SIGI_VALIDATOR_TOKEN:-validator-dev-token}
      SIGI_READER_TOKEN: ${SIGI_READER_TOKEN:-reader-dev-token}
      SIGI_INTEGRATION_TOKEN: ${SIGI_INTEGRATION_TOKEN:-integration-dev-token}
      SIGI_SECRETS_KEY: ${SIGI_SECRETS_KEY:-sigi-dev-secret}
      SIGI_INTERNAL_SERVICE_TOKEN: ${SIGI_INTERNAL_SERVICE_TOKEN:-sigi-dev-internal-token}
      SIGI_ALLOW_LEGACY_ADMIN_TOKENS: ${SIGI_ALLOW_LEGACY_ADMIN_TOKENS:-false}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-1800}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_SECONDS: ${AUTH_LOCKOUT_SECONDS:-900}
      SIGI_CORS_ALLOWED_ORIGINS: ${SIGI_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174}
      SIGI_TRUST_PROXY_HOPS: ${SIGI_TRUST_PROXY_HOPS:-0}
      SIGI_ENABLE_DB_RESET: ${SIGI_ENABLE_DB_RESET:-true}
      SIGI_DB_RESET_PASSPHRASE: ${SIGI_DB_RESET_PASSPHRASE:-reset-sigi-demo-2026}
      GEOSERVER_INTERNAL_URL: ${GEOSERVER_INTERNAL_URL:-http://geoserver:8080/geoserver}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_WORKSPACE: ${GEOSERVER_WORKSPACE:-sigi}
      GEOSERVER_DATASTORE: ${GEOSERVER_DATASTORE:-sigi_postgis}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./apps/sigi-api:/usr/src/app
      - sigi_api_node_modules:/usr/src/app/node_modules
      - sigi_files_data:/var/sigi-files

  frontend-sigi:
    build:
      context: .
      dockerfile: ./apps/frontend-sigi/Dockerfile
      args:
        VITE_SIGI_API_URL: http://127.0.0.1:${SIGI_API_PORT:-3000}/api
        VITE_GEOSERVER_ENABLED: ${VITE_GEOSERVER_ENABLED:-true}
        VITE_GEOSERVER_WMS_URL: http://127.0.0.1:${GEOSERVER_PORT:-8081}/geoserver/wms
        VITE_GEOSERVER_TERRITORIES_LAYER: ${VITE_GEOSERVER_TERRITORIES_LAYER:-sigi:public_territories}
        VITE_GEOSERVER_PROJECT_LAYER: ${VITE_GEOSERVER_PROJECT_LAYER:-sigi:public_project_polygons}
    ports:
      - "${SIGI_FRONTEND_PORT:-${FRONTEND_ADMIN_PORT:-5174}}:80"
    depends_on:
      sigi-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  integration-service:
    build: ./services/integration-service
    ports:
      - "${INTEGRATION_SERVICE_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sigi_user:sigi_password@postgres:5432/sigi_db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_CLIENT_TIMEOUT_MS: ${HTTP_CLIENT_TIMEOUT_MS:-5000}
      HTTP_CLIENT_MAX_RETRIES: ${HTTP_CLIENT_MAX_RETRIES:-2}
      OUTBOUND_HTTP_ALLOWED_HOSTS: ${OUTBOUND_HTTP_ALLOWED_HOSTS:-host.docker.internal}
      OUTBOUND_HTTP_MAX_REDIRECTS: ${OUTBOUND_HTTP_MAX_REDIRECTS:-3}
      OUTBOUND_HTTP_MAX_RESPONSE_BYTES: ${OUTBOUND_HTTP_MAX_RESPONSE_BYTES:-10485760}
      SIGI_SECRETS_KEY: ${SIGI_SECRETS_KEY:-sigi-dev-secret}
      SIGI_INTERNAL_SERVICE_TOKEN: ${SIGI_INTERNAL_SERVICE_TOKEN:-sigi-dev-internal-token}
      SIGI_IMPORT_API_URL: ${SIGI_IMPORT_API_URL:-http://sigi-api:3000/api}
      SIGI_IMPORT_ADMIN_TOKEN: ${SIGI_IMPORT_ADMIN_TOKEN:-integration-dev-token}
      ODOO_MOCK_MODE: ${ODOO_MOCK_MODE:-false}
      ODOO_URL: ${ODOO_URL:-http://host.docker.internal:8069}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_PASS: ${ODOO_PASS:-}
      ODOO_DEFAULT_COUNTRY: ${ODOO_DEFAULT_COUNTRY:-Costa Rica}
      ODOO_BATCH_SIZE: ${ODOO_BATCH_SIZE:-500}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./services/integration-service:/app

  gis-service:
    build: ./services/gis-service
    ports:
      - "${GIS_SERVICE_BIND_HOST:-127.0.0.1}:${GIS_SERVICE_PORT:-8002}:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sigi_user:sigi_password@postgres:5432/sigi_db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_CLIENT_TIMEOUT_MS: ${HTTP_CLIENT_TIMEOUT_MS:-5000}
      HTTP_CLIENT_MAX_RETRIES: ${HTTP_CLIENT_MAX_RETRIES:-2}
      SIGI_INTERNAL_SERVICE_TOKEN: ${SIGI_INTERNAL_SERVICE_TOKEN:-sigi-dev-internal-token}
      SHAPEFILE_DEFAULT_COUNTRY: ${SHAPEFILE_DEFAULT_COUNTRY:-Costa Rica}
      SHAPEFILE_NATIONAL_BBOX: ${SHAPEFILE_NATIONAL_BBOX:--86.0,8.0,-82.0,11.5}
      SHAPEFILE_PREVIEW_LIMIT: ${SHAPEFILE_PREVIEW_LIMIT:-5}
      SHAPEFILE_ARCHIVE_MAX_BYTES: ${SHAPEFILE_ARCHIVE_MAX_BYTES:-26214400}
      SHAPEFILE_ZIP_MAX_ENTRIES: ${SHAPEFILE_ZIP_MAX_ENTRIES:-100}
      SHAPEFILE_ZIP_MAX_UNCOMPRESSED_BYTES: ${SHAPEFILE_ZIP_MAX_UNCOMPRESSED_BYTES:-104857600}
      SHAPEFILE_ZIP_MAX_COMPRESSION_RATIO: ${SHAPEFILE_ZIP_MAX_COMPRESSION_RATIO:-100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./services/gis-service:/app

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.0
    ports:
      - "${GEOSERVER_BIND_HOST:-127.0.0.1}:${GEOSERVER_PORT:-8081}:8080"
    environment:
      GEOSERVER_DATA_DIR: /opt/geoserver_data
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "Origin,Accept,X-Requested-With,Content-Type,Access-Control-Request-Method,Access-Control-Request-Headers"
      CORS_ALLOW_CREDENTIALS: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/geoserver/web/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - geoserver_data:/opt/geoserver_data

  geoserver-init:
    image: curlimages/curl:8.8.0
    depends_on:
      postgres:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_WORKSPACE: ${GEOSERVER_WORKSPACE:-sigi}
      GEOSERVER_DATASTORE: ${GEOSERVER_DATASTORE:-sigi_postgis}
      GEOSERVER_DB_HOST: postgres
      GEOSERVER_DB_PORT: 5432
      GEOSERVER_DB_NAME: ${POSTGRES_DB:-sigi_db}
      GEOSERVER_DB_SCHEMA: ${GEOSERVER_DB_SCHEMA:-gis}
      GEOSERVER_DB_USER: ${POSTGRES_USER:-sigi_user}
      GEOSERVER_DB_PASSWORD: ${POSTGRES_PASSWORD:-sigi_password}
      GEOSERVER_PUBLISH_PUBLIC_TERRITORIES: ${GEOSERVER_PUBLISH_PUBLIC_TERRITORIES:-true}
      GEOSERVER_PUBLIC_FEATURE_NAME: ${GEOSERVER_PUBLIC_FEATURE_NAME:-public_territories}
      GEOSERVER_PUBLIC_VIEW_NAME: ${GEOSERVER_PUBLIC_VIEW_NAME:-v_public_territories}
      GEOSERVER_PUBLISH_PUBLIC_PROJECT_POLYGONS: ${GEOSERVER_PUBLISH_PUBLIC_PROJECT_POLYGONS:-true}
      GEOSERVER_PUBLIC_PROJECT_FEATURE_NAME: ${GEOSERVER_PUBLIC_PROJECT_FEATURE_NAME:-public_project_polygons}
      GEOSERVER_PUBLIC_PROJECT_VIEW_NAME: ${GEOSERVER_PUBLIC_PROJECT_VIEW_NAME:-v_public_project_polygons}
      GEOSERVER_PUBLISH_PUBLIC_PROJECT_CENTROIDS: ${GEOSERVER_PUBLISH_PUBLIC_PROJECT_CENTROIDS:-true}
      GEOSERVER_PUBLIC_PROJECT_CENTROID_FEATURE_NAME: ${GEOSERVER_PUBLIC_PROJECT_CENTROID_FEATURE_NAME:-public_project_centroids}
      GEOSERVER_PUBLIC_PROJECT_CENTROID_VIEW_NAME: ${GEOSERVER_PUBLIC_PROJECT_CENTROID_VIEW_NAME:-v_public_project_centroids}
    command: ["sh", "/bootstrap/bootstrap.sh"]
    restart: "no"
    volumes:
      - ./infra/geoserver/bootstrap.sh:/bootstrap/bootstrap.sh:ro

volumes:
  postgres_data:
  geoserver_data:
  sigi_files_data:
  sigi_api_node_modules:
